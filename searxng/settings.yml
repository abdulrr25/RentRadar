# Minimal override on top of SearXNG's packaged defaults — see
# https://docs.searxng.org/admin/settings/settings.html for the full schema.
# This instance is private (only RentRadar's backend calls it), so the two
# things that matter are: enable the JSON API (off by default for public
# instances) and disable the bot-detection limiter (meant for public
# instances fending off abuse, not a single known caller).
use_default_settings: true

general:
  instance_name: "RentRadar SearXNG"

search:
  safe_search: 0
  formats:
    - html
    - json

server:
  # Overridden at runtime by the SEARXNG_SECRET env var (see Dockerfile) —
  # this placeholder is never actually used.
  secret_key: "changeme"
  limiter: false
  image_proxy: false

# use_default_settings only enables a small general-web subset (duckduckgo,
# brave, google cse) — verified live: all three were already rate-limited
# or timing out from Render's shared IP within minutes of first deploy,
# leaving zero results for every search. These plain engines exist in
# SearXNG's catalog but are disabled by default; turning them on widens the
# odds that at least one responds on a given request.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
