services:
  - type: web
    name: rentradar-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANAKIN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Required for saved-search alerts / shareable briefs to survive a
      # redeploy — Render's own disk on the free plan does not. Point at a
      # free Turso database (turso.tech) instead of leaving unset in prod.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # Optional — enables POST /internal/run-alerts (saved-search matching worker).
      # Leave unset to keep it disabled.
      - key: ALERTS_INTERNAL_SECRET
        sync: false
      # Optional — saved-search alert channels. Each is independently stubbed
      # (logged, not sent) until its own env vars are set — see backend/channels/.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Optional — enables Sentry error tracking. Leave unset to run with no-op
      # tracking (nothing sent, no error, same pattern as every channel above).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        sync: false
    healthCheckPath: /health
