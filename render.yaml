services:
  - type: web
    name: rentradar-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANAKIN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional — enables POST /internal/run-alerts (saved-search matching worker).
      # Leave unset to keep it disabled. Note: Render's default disk is not
      # persistent across deploys, so backend/alerts.db resets on redeploy
      # until a persistent disk or external DB is attached.
      - key: ALERTS_INTERNAL_SECRET
        sync: false
      # Optional — saved-search alert channels. Each is independently stubbed
      # (logged, not sent) until its own env vars are set — see backend/channels/.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
    healthCheckPath: /health
